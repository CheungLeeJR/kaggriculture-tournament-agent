name: One-time agent migration

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy standalone agent from legacy portfolio
        run: |
          mkdir -p src
          curl -fsSL https://raw.githubusercontent.com/CheungLeeJR/my-first-ai-project/main/kaggriculture-tournament-agent/src/agent.py -o src/agent.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/agent.py
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Migrate standalone tournament agent"
          git push
